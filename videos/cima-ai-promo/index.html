<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

<div id="root" data-composition-id="root" data-start="0" data-duration="25" data-width="1920" data-height="1080">

  <!-- ══ SCENE 1: LEGAL. (0–5s) — navy canvas, white slam ══ -->
  <div id="s1" class="clip scene" data-start="0" data-duration="5" data-track-index="0">
    <div class="s1-bg"></div>
    <div class="scene-content s1-layout">
      <div id="s1-eyebrow" class="s1-eyebrow">CIMA AI</div>
      <div id="s1-bar" class="s1-bar"></div>
      <h1 id="s1-word" class="s1-word">LEGAL.</h1>
    </div>
  </div>

  <!-- ══ SCENE 2: INTELLIGENCE. (5–10s) — near-black canvas, gold slam ══ -->
  <div id="s2" class="clip scene" data-start="5" data-duration="5" data-track-index="0">
    <div class="s2-bg"></div>
    <div class="scene-content s2-layout">
      <h1 id="s2-word" class="s2-word">INTELLIGENCE.</h1>
      <div id="s2-rule" class="s2-rule"></div>
    </div>
  </div>

  <!-- ══ SCENE 3: CIMA AI — THE REVEAL (10–17s) ══ -->
  <div id="s3" class="clip scene" data-start="10" data-duration="7" data-track-index="0">
    <div class="s3-bg"></div>
    <div id="s3-pin-tl" class="corner-pin pin-tl"></div>
    <div id="s3-pin-tr" class="corner-pin pin-tr"></div>
    <div id="s3-pin-bl" class="corner-pin pin-bl"></div>
    <div id="s3-pin-br" class="corner-pin pin-br"></div>
    <div class="scene-content s3-layout">
      <div class="s3-name-row">
        <span id="s3-cima" class="s3-cima">CIMA</span>
        <span id="s3-ai" class="s3-ai">AI</span>
      </div>
      <p id="s3-tag" class="s3-tag">AI-native legal intelligence for the modern arbitration practitioner.</p>
      <div id="s3-standards" class="s3-standards">ICC · UNCITRAL · LCIA · NEW YORK CONVENTION</div>
    </div>
  </div>

  <!-- ══ SCENE 4: FEATURES (17–22s) — white canvas, rapid-fire stack ══ -->
  <div id="s4" class="clip scene" data-start="17" data-duration="5" data-track-index="0">
    <div class="s4-bg"></div>
    <div class="scene-content s4-layout">
      <div id="s4-eyebrow" class="s4-eyebrow">What CIMA AI does</div>
      <div class="s4-stack">
        <h2 id="s4-w1" class="s4-word">RESEARCH.</h2>
        <h2 id="s4-w2" class="s4-word">REVIEW.</h2>
        <h2 id="s4-w3" class="s4-word s4-word--gold">MANAGE.</h2>
      </div>
    </div>
  </div>

  <!-- ══ SCENE 5: CLOSE (22–25s) — final brand lockup ══ -->
  <div id="s5" class="clip scene" data-start="22" data-duration="3" data-track-index="0">
    <div class="s5-bg"></div>
    <div class="scene-content s5-layout">
      <div id="s5-brand" class="s5-brand">CIMA AI</div>
      <p id="s5-sub" class="s5-sub">Legal Intelligence Platform</p>
      <div id="s5-cta" class="s5-cta">Available now →</div>
      <div id="s5-url" class="s5-url">cimaai.vercel.app</div>
    </div>
    <div id="s5-overlay" class="s5-overlay"></div>
  </div>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #082F49;
    }

    :root {
      --brand-primary:   #082F49;
      --brand-secondary: #FBBF24;
      --brand-tertiary:  #0369A1;
      --ink:             #0F172A;
      --canvas:          #FFFFFF;
      --shadow-hard:     8px 8px 0 #0F172A;
      --border-bold:     4px solid #0F172A;
      --font-display:    'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono:       'Space Mono', ui-monospace, monospace;
    }

    [data-composition-id="root"] {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--brand-primary);
      font-family: var(--font-display);
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .scene-content {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
    }

    /* ── Scene 1: LEGAL. ──────────────────────────────── */
    .s1-bg { position: absolute; inset: 0; background: var(--brand-primary); }

    .s1-layout {
      flex-direction: column;
      justify-content: center;
      padding: 100px 120px;
    }

    .s1-eyebrow {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--brand-secondary);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .s1-bar {
      width: 180px;
      height: 10px;
      background: var(--brand-secondary);
      margin-bottom: 36px;
    }

    .s1-word {
      font-family: var(--font-display);
      font-size: 310px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    /* ── Scene 2: INTELLIGENCE. ───────────────────────── */
    .s2-bg { position: absolute; inset: 0; background: var(--ink); }

    .s2-layout {
      flex-direction: column;
      justify-content: center;
      padding: 100px 80px;
    }

    .s2-word {
      font-family: var(--font-display);
      font-size: 200px;
      font-weight: 800;
      color: var(--brand-secondary);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .s2-rule {
      width: 100%;
      height: 8px;
      background: var(--brand-secondary);
      margin-top: 52px;
      transform-origin: left center;
    }

    /* ── Scene 3: CIMA AI REVEAL ──────────────────────── */
    .s3-bg { position: absolute; inset: 0; background: var(--brand-primary); }

    .corner-pin {
      position: absolute;
      width: 44px;
      height: 44px;
      border-color: rgba(255,255,255,0.55);
      border-style: solid;
      border-width: 0;
    }
    .pin-tl { top: 52px; left: 52px;   border-top-width: 4px; border-left-width: 4px; }
    .pin-tr { top: 52px; right: 52px;  border-top-width: 4px; border-right-width: 4px; }
    .pin-bl { bottom: 52px; left: 52px;  border-bottom-width: 4px; border-left-width: 4px; }
    .pin-br { bottom: 52px; right: 52px; border-bottom-width: 4px; border-right-width: 4px; }

    .s3-layout {
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 80px 120px;
    }

    .s3-name-row {
      display: flex;
      align-items: baseline;
      gap: 48px;
    }

    .s3-cima {
      font-family: var(--font-display);
      font-size: 270px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .s3-ai {
      font-family: var(--font-display);
      font-size: 270px;
      font-weight: 800;
      color: var(--brand-secondary);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .s3-tag {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      max-width: 860px;
      margin: 32px 0 18px 0;
      line-height: 1.4;
    }

    .s3-standards {
      font-family: var(--font-mono);
      font-size: 18px;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.07em;
    }

    /* ── Scene 4: FEATURES ────────────────────────────── */
    .s4-bg { position: absolute; inset: 0; background: var(--canvas); }

    .s4-layout {
      flex-direction: column;
      justify-content: center;
      padding: 80px 120px;
    }

    .s4-eyebrow {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--brand-tertiary);
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .s4-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .s4-word {
      font-family: var(--font-display);
      font-size: 200px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .s4-word--gold {
      color: var(--brand-secondary);
    }

    /* ── Scene 5: CLOSE ───────────────────────────────── */
    .s5-bg { position: absolute; inset: 0; background: var(--brand-primary); }

    .s5-layout {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      text-align: center;
    }

    .s5-brand {
      font-family: var(--font-display);
      font-size: 120px;
      font-weight: 800;
      color: var(--brand-secondary);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .s5-sub {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 400;
      color: rgba(255,255,255,0.78);
      margin: 24px 0 52px 0;
    }

    .s5-cta {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      background: var(--brand-secondary);
      border: var(--border-bold);
      box-shadow: var(--shadow-hard);
      padding: 20px 56px;
      letter-spacing: 0.04em;
      margin-bottom: 40px;
    }

    .s5-url {
      font-family: var(--font-mono);
      font-size: 20px;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.08em;
    }

    .s5-overlay {
      position: absolute;
      inset: 0;
      background: var(--ink);
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const EASE_ENTRY = "back.out(2.4)";
    const EASE_EMPH  = "expo.out";
    const EASE_EXIT  = "power4.in";
    const EASE_DRIFT = "sine.inOut";

    // ─── SCENE 1: LEGAL. (0–5s) ───────────────────────────────
    tl.from("#s1-eyebrow", { opacity: 0, y: -16, duration: 0.3,  ease: EASE_EMPH  }, 0.1);
    tl.from("#s1-bar",     { width: 0,           duration: 0.35, ease: EASE_EMPH  }, 0.18);
    tl.from("#s1-word",    { y: 260, opacity: 0, duration: 0.45, ease: EASE_ENTRY }, 0.28);

    // ─── SCENE 2: INTELLIGENCE. (5–10s) ──────────────────────
    tl.from("#s2-word", { y: 280, opacity: 0, duration: 0.45, ease: EASE_ENTRY }, 5.1);
    tl.from("#s2-rule", { scaleX: 0,           duration: 0.4,  ease: EASE_EMPH, transformOrigin: "left center" }, 5.42);

    // ─── SCENE 3: CIMA AI REVEAL (10–17s) ─────────────────────
    tl.from("#s3-pin-tl", { opacity: 0, scale: 0, duration: 0.2, ease: EASE_EMPH, transformOrigin: "top left"    }, 10.1);
    tl.from("#s3-pin-tr", { opacity: 0, scale: 0, duration: 0.2, ease: EASE_EMPH, transformOrigin: "top right"   }, 10.15);
    tl.from("#s3-pin-bl", { opacity: 0, scale: 0, duration: 0.2, ease: EASE_EMPH, transformOrigin: "bottom left" }, 10.2);
    tl.from("#s3-pin-br", { opacity: 0, scale: 0, duration: 0.2, ease: EASE_EMPH, transformOrigin: "bottom right"}, 10.25);
    tl.from("#s3-cima",   { x: -180, opacity: 0, duration: 0.45, ease: EASE_ENTRY }, 10.2);
    tl.from("#s3-ai",     { x:  180, opacity: 0, duration: 0.35, ease: EASE_ENTRY }, 10.44);
    tl.from("#s3-tag",    { y: 28, opacity: 0, duration: 0.5, ease: EASE_EMPH   }, 11.0);
    tl.from("#s3-standards", { opacity: 0,         duration: 0.4, ease: EASE_DRIFT }, 11.55);

    // ─── SCENE 4: FEATURES (17–22s) ───────────────────────────
    tl.from("#s4-eyebrow", { opacity: 0, x: -20, duration: 0.3,  ease: EASE_EMPH  }, 17.1);
    tl.from("#s4-w1",      { y: 200, opacity: 0, duration: 0.35, ease: EASE_ENTRY }, 17.2);
    tl.from("#s4-w2",      { y: 200, opacity: 0, duration: 0.35, ease: EASE_ENTRY }, 17.37);
    tl.from("#s4-w3",      { y: 200, opacity: 0, duration: 0.35, ease: EASE_ENTRY }, 17.54);

    // ─── SCENE 5: CLOSE (22–25s) ──────────────────────────────
    tl.from("#s5-brand", { scale: 0.82, opacity: 0, duration: 0.4,  ease: EASE_ENTRY }, 22.1);
    tl.from("#s5-sub",   { opacity: 0, y: 18,       duration: 0.3,  ease: EASE_EMPH  }, 22.42);
    tl.from("#s5-cta",   { scale: 0.9, opacity: 0,  duration: 0.25, ease: EASE_ENTRY }, 22.64);
    tl.from("#s5-url",   { opacity: 0,              duration: 0.25, ease: EASE_DRIFT }, 22.86);
    // Final scene only: fade to black
    tl.to("#s5-overlay", { opacity: 1, duration: 0.55, ease: EASE_EXIT }, 24.45);

    window.__timelines["root"] = tl;
  </script>

</div>
</body>
</html>
