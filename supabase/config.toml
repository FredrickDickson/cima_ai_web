[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://cimaai.thecima.org"
additional_redirect_urls = [
  "https://cimaai.thecima.org/reset-password",
  "http://localhost:5173/reset-password",
]

[auth.email]
# Pinned explicitly so future `config push` runs don't silently depend on
# whatever the CLI's own default happens to be for this security setting.
double_confirm_changes = true

[storage]
enabled = true

# Paystack calls this directly over the public internet — it can't carry a
# Supabase user JWT, so it's the one function in this repo that opts out of
# the platform's default JWT verification. Every event is instead verified
# via the x-paystack-signature HMAC inside the function itself (see
# supabase/functions/paystack-webhook/index.ts).
[functions.paystack-webhook]
verify_jwt = false
